name: leak-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks（全履歴）
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks git . --no-banner -v
      - name: 個人情報パターン（denylist なし）
        env:
          LC_ALL: C.UTF-8
        run: |
          pip install --quiet pillow
          mkdir -p ~/.config/share-guard && touch ~/.config/share-guard/denylist.txt
          .githooks/pii-scan all
