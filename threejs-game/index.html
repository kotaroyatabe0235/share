<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js ゲームの練習</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666666; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --fg: #e8e8e8; --muted: #9a9a9a; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; line-height: 1.7; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Three.js ゲームの練習</h1>
  <p>Web の基礎から始めて、ブラウザで動く小さな3Dゲームを作ります。1回に1つの仕組みだけ足していきます。</p>
  <h2>作るもの</h2>
  <p>夜の中庭を懐中電灯の明かりだけで歩き、落とし物を集めるゲーム。</p>
  <h2>回の一覧</h2>
  <p class="muted">まだありません。</p>
</main>
</body>
</html>
