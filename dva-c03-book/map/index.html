<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DVA-C03 学習の地図</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: 全画面の地図。分野を4つの領地、章を列、節をカードにして並べる。右（狭い画面は下）に読む枠 */
:root{
  --bg:#eef0ea; --land:#f8f9f5; --card:#ffffff; --ink:#1d2330; --muted:#5a6373; --line:#d6dad2;
  --accent:#1d5c86; --accent-soft:#e2ecf4; --shadow:0 1px 3px rgba(29,35,48,.12);
  --d0:#6b7280; --d1:#1d5c86; --d2:#8a3b5c; --d3:#2f6b46; --d4:#8a5a12; --d9:#6b7280;
  --pre:#1d5c86; --pair:#2f6b46; --cmp:#b0491f; --read:#2f6b46;
  --tip:#276b45; --tip-bg:#e8f3ec; --trap:#9a4419; --trap-bg:#f8ece4; --code-bg:#eef0ec;
  --f-display:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --bar-h:52px;
  --f-mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --land:#161b22; --card:#1c222b; --ink:#e4e7ec; --muted:#9aa3b2; --line:#2c3442;
  --accent:#7fb6dd; --accent-soft:#1c2a38; --shadow:0 1px 3px rgba(0,0,0,.5);
  --d0:#9aa3b2; --d1:#7fb6dd; --d2:#e094b4; --d3:#7fc79b; --d4:#e3b261; --d9:#9aa3b2;
  --pre:#7fb6dd; --pair:#7fc79b; --cmp:#f0a07a; --read:#7fc79b;
  --tip:#7fc79b; --tip-bg:#17271f; --trap:#e6a07a; --trap-bg:#2b1d16; --code-bg:#1f2530; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --land:#161b22; --card:#1c222b; --ink:#e4e7ec; --muted:#9aa3b2; --line:#2c3442;
  --accent:#7fb6dd; --accent-soft:#1c2a38; --shadow:0 1px 3px rgba(0,0,0,.5);
  --d0:#9aa3b2; --d1:#7fb6dd; --d2:#e094b4; --d3:#7fc79b; --d4:#e3b261; --d9:#9aa3b2;
  --pre:#7fb6dd; --pair:#7fc79b; --cmp:#f0a07a; --read:#7fc79b;
  --tip:#7fc79b; --tip-bg:#17271f; --trap:#e6a07a; --trap-bg:#2b1d16; --code-bg:#1f2530; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--land)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:fixed;z-index:9;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--land);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:17px;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-left:6px;letter-spacing:.08em}
.bar .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.iconbtn[aria-pressed="true"],.iconbtn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.search{position:relative}
.search input{width:min(15rem,42vw);border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;color:var(--ink)}
.results{position:fixed;box-sizing:border-box;max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results .rc{display:block;font-size:11px;color:var(--muted)}
#vp{position:fixed;inset:0;touch-action:none;cursor:grab}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.terr{position:absolute;border-radius:14px;background:var(--land);border:1px solid var(--line)}
.terr .th{position:absolute;left:22px;top:14px;right:22px}
.terr .th .eb{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.terr .th .tt{font-family:var(--f-display);font-size:24px;line-height:1.3}
.terr .th .wt{font-family:var(--f-mono);font-size:13px;margin-left:8px}
.terr .bigname{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;font-family:var(--f-display);font-size:96px;line-height:1.2;padding:40px}
.chhead{position:absolute;border:0;background:none;text-align:left;cursor:pointer;padding:6px 8px;border-radius:8px}
.chhead:hover{background:var(--accent-soft)}
.chhead .no{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.chhead .ct{display:block;font-weight:700;font-size:15px;line-height:1.35}
.card{position:absolute;box-sizing:border-box;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;box-shadow:var(--shadow);overflow:hidden}
.card:hover{border-color:var(--accent)}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
.card.dim{opacity:.35}
.card .ttl{display:block;font-weight:700;font-size:13.5px;line-height:1.35;max-height:2.7em;overflow:hidden}
.card .sk{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:0 4px}
.card .sm{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:3px;max-height:2.9em;overflow:hidden}
.card .lk{font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.card.quiz{background:var(--accent-soft);border-style:dashed}
.card .rd{display:none;font-size:10.5px;font-weight:700;color:var(--read);white-space:nowrap}
.card.read{border-color:var(--read);box-shadow:inset 4px 0 0 var(--read),var(--shadow)}
.card.read .rd{display:inline}
.prog{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog b{color:var(--read)}
.readbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px}
.readbox .st{flex:1;min-width:10rem;color:var(--muted)}
.readbox .st b{color:var(--read)}
.readbox .em{color:var(--trap);font-weight:700}
.readbtn{border:1px solid var(--read);background:var(--read);color:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px}
.undobtn{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.readbtn:disabled,.undobtn:disabled{opacity:.5;cursor:default}
#index .si.read::before{content:"✓ ";color:var(--read)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.store{font-size:11px;color:var(--muted);margin-top:4px}
#world.mid .card .sm{display:none}
#world.far .card,#world.far .chhead,#world.far .th{visibility:hidden}
#world.far .terr .bigname{display:flex}
svg#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg#links path{fill:none;stroke-width:2;opacity:.55}
svg#links path.hi{stroke-width:3.5;opacity:1}
svg#links path.lo{opacity:.12}
.zoom{position:fixed;z-index:4;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-size:18px}
.legend{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);display:grid;gap:3px}
.legend[hidden],.results[hidden]{display:none}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.panel{position:fixed;z-index:7;background:var(--land);border:1px solid var(--line);box-shadow:var(--shadow);overflow-y:auto;-webkit-overflow-scrolling:touch}
#detail{top:calc(env(safe-area-inset-top,0px) + var(--bar-h));right:0;bottom:0;width:min(34rem,100vw);border-radius:12px 0 0 0;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) 22px;box-sizing:border-box}
#index{top:calc(env(safe-area-inset-top,0px) + var(--bar-h));left:0;bottom:0;width:min(20rem,88vw);border-radius:0 12px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 30px) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
@media (max-width:640px){
  #index{z-index:8}
  #detail{top:auto;height:78vh;width:100vw;border-radius:14px 14px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px))}
  body.detail-open .zoom,body.detail-open .legend{display:none}
  .brand small{display:none}
}
.close{position:sticky;top:0;float:right;border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;z-index:1}
.crumb{font-size:12px;color:var(--muted);margin:2px 44px 4px 0}
.crumb button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline}
#detail h2{font-family:var(--f-display);font-size:21px;line-height:1.4;margin:4px 0 8px;text-wrap:balance}
#detail .body{line-height:1.85;font-size:15px}
#detail .body h4{font-size:15.5px;margin:1.4rem 0 .3rem}
#detail .body p{margin:.6rem 0}
#detail .body ul,#detail .body ol{padding-left:1.3rem}
#detail .body li{margin:.2rem 0}
.box{margin:1rem 0;padding:.7rem .9rem;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.box>.bt{font-weight:700;font-size:13px;margin:0 0 .2rem}
.box.tip{background:var(--tip-bg);border-color:transparent}.box.tip>.bt{color:var(--tip)}
.box.trap{background:var(--trap-bg);border-color:transparent}.box.trap>.bt{color:var(--trap)}
.box.note>.bt{color:var(--muted)}
.tbl{overflow-x:auto;margin:.8rem 0}
table{border-collapse:collapse;font-size:13px;line-height:1.55;min-width:100%}
th,td{border:1px solid var(--line);padding:.35rem .5rem;vertical-align:top;text-align:left}
th{background:var(--accent-soft)}
td.num,th.num{font-variant-numeric:tabular-nums;white-space:nowrap}
code{font-family:var(--f-mono);font-size:.85em;background:var(--code-bg);border-radius:3px;padding:.05em .3em;overflow-wrap:anywhere}
pre{background:var(--code-bg);border-radius:6px;padding:.7rem .9rem;overflow-x:auto;font-size:12.5px;line-height:1.5}
pre code{background:none;padding:0;overflow-wrap:normal}
.skill{font-family:var(--f-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:0 .35rem}
.quiz{margin:1rem 0;padding:.8rem .9rem;background:var(--card);border:1px solid var(--line);border-radius:6px}
.quiz .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0}
.quiz ol.choices{list-style:upper-alpha}
.quiz summary{cursor:pointer;color:var(--accent);font-weight:700}
.sources{font-size:12.5px;color:var(--muted)}
.sources a{overflow-wrap:anywhere}
.sec-h{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:1.6rem 0 .4rem;border-top:1px solid var(--line);padding-top:.9rem}
.conn{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.conn button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;cursor:pointer}
.conn button:hover{border-color:var(--accent)}
.conn .tg{font-size:11px;font-weight:700;margin-right:6px}
.conn .to{font-weight:700;font-size:13.5px}
.conn .wy{display:block;font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:2px}
.conn .wc{display:block;font-size:11px;color:var(--muted)}
.navs{display:flex;gap:8px;margin-top:1.4rem}
.navs button{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;cursor:pointer;font-size:13px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navs button:last-child{text-align:right}
.navs button:disabled{opacity:.4;cursor:default}
#index h3{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:1rem 0 .3rem}
#index ul{list-style:none;padding:0;margin:0}
#index button{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13.5px}
#index button:hover{background:var(--accent-soft)}
#index .ci{font-weight:700}
#index .si{padding-left:18px;color:var(--muted);font-size:12.5px}
.hint{position:fixed;z-index:3;pointer-events:none;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 10px);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">DVA-C03 学習の地図<small>AWS DEVELOPER ASSOCIATE</small></div>
  <span class="sp"></span>
  <span class="prog" id="prog" hidden></span>
  <button class="iconbtn" id="btnIndex" aria-expanded="false" aria-controls="index">目次</button>
  <button class="iconbtn" id="btnLinks" aria-pressed="false">つながり</button>
  <div class="search"><input id="q" type="search" placeholder="言葉で探す" aria-label="言葉で探す" autocomplete="off"><div class="results" id="res" hidden></div></div>
</div>
<div id="vp"><div id="world"><svg id="links"></svg></div></div>
<div id="live" class="sr" aria-live="polite"></div>
<div class="loading" id="loading">読み込んでいます</div>
<div class="hint" id="hint">カードを押すと中身が開く。ドラッグか二本指で移動、ホイールかピンチで拡大</div>
<div class="legend" id="legend" hidden>
  <div><i style="border-color:var(--pre)"></i>先に知っておくと分かる</div>
  <div><i style="border-color:var(--pair)"></i>組み合わせて使う</div>
  <div><i style="border-color:var(--cmp);border-top-style:dashed"></i>取り違えやすい・比べる</div>
</div>
<div class="zoom">
  <button id="zin" aria-label="拡大">＋</button>
  <button id="zout" aria-label="縮小">－</button>
  <button id="zfit" aria-label="全体を表示" style="font-size:13px">全体</button>
</div>
<nav class="panel" id="index" hidden aria-label="目次"><button class="close" data-close="index" aria-label="閉じる">×</button><div id="indexBody"></div></nav>
<article class="panel" id="detail" hidden><button class="close" data-close="detail" aria-label="閉じる">×</button><div id="detailBody"></div></article>
<script>
(function(){
const $=id=>document.getElementById(id);
const TYPES={pre:{name:'先に知っておくと分かる',c:'var(--pre)'},pair:{name:'組み合わせて使う',c:'var(--pair)'},cmp:{name:'取り違えやすい・比べる',c:'var(--cmp)',dash:'7 5'}};
const DCOL={part0:'var(--d0)',part1:'var(--d1)',part2:'var(--d2)',part3:'var(--d3)',part4:'var(--d4)',part9:'var(--d9)'};
const CW=250,CH=84,CG=10,CHH=64,PAD=24,TH=78,COLG=22;
let D,cardById={},chById={},domById={},linksOf={},view={x:0,y:0,z:1},sel=null,linksOn=false,txt={};
const vp=$('vp'),world=$('world'),svg=$('links');

fetch('data.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(init).catch(e=>{$('loading').textContent='データを読めなかった（'+e.message+'）。ページを開き直してみて'});

function init(data){
  D=data;$('loading').remove();
  D.domains.forEach(d=>domById[d.id]=d);
  D.chapters.forEach(c=>{chById[c.id]=c;c.cards=[]});
  D.cards.forEach(c=>{cardById[c.id]=c;chById[c.ch].cards.push(c);linksOf[c.id]=[]});
  D.links.forEach((l,i)=>{l.i=i;linksOf[l.a].push(l);linksOf[l.b].push(l)});
  layout();buildIndex();drawLinks();fit(false);initReads();
  window.addEventListener('hashchange',route);route();
  setTimeout(()=>{const h=$('hint');if(h)h.remove()},6000);
}

// ---- 配置：上に「はじめに」、2×2 に分野、下に「付録」
function layout(){
  const terr={};
  D.domains.forEach(d=>{
    const chs=D.chapters.filter(c=>c.domain===d.id);
    const h=Math.max(...chs.map(c=>c.cards.length))*(CH+CG)+CHH;
    terr[d.id]={w:chs.length*CW+(chs.length-1)*COLG+PAD*2,h:TH+h+PAD,chs};
  });
  const G=60,big=['part1','part2','part3','part4'];
  const colW=[Math.max(terr.part1.w,terr.part3.w),Math.max(terr.part2.w,terr.part4.w)];
  const rowH=[Math.max(terr.part1.h,terr.part2.h),Math.max(terr.part3.h,terr.part4.h)];
  let y=0;
  const place=(id,x,yy,w,h)=>{const t=terr[id];t.x=x;t.y=yy;t.w=w||t.w;t.h=h||t.h};
  place('part0',0,0,colW[0]+G+colW[1]);y=terr.part0.h+G;
  place('part1',0,y,colW[0],rowH[0]);place('part2',colW[0]+G,y,colW[1],rowH[0]);y+=rowH[0]+G;
  place('part3',0,y,colW[0],rowH[1]);place('part4',colW[0]+G,y,colW[1],rowH[1]);y+=rowH[1]+G;
  if(terr.part9){place('part9',0,y,colW[0]+G+colW[1]);y+=terr.part9.h}
  world.style.width=(colW[0]+G+colW[1])+'px';world.style.height=y+'px';
  D.size={w:colW[0]+G+colW[1],h:y};
  D.domains.forEach(d=>{
    const t=terr[d.id],el=document.createElement('div');el.className='terr';
    Object.assign(el.style,{left:t.x+'px',top:t.y+'px',width:t.w+'px',height:t.h+'px',borderTop:'6px solid '+DCOL[d.id]});
    el.innerHTML=`<div class="th"><div class="eb">${esc(d.eyebrow)}</div><div class="tt">${esc(d.title)}${d.weight?`<span class="wt" style="color:${DCOL[d.id]}">${d.weight}%</span>`:''}</div></div><div class="bigname" style="color:${DCOL[d.id]}">${esc(d.title)}${d.weight?'<br>'+d.weight+'%':''}</div>`;
    world.insertBefore(el,svg);
    t.chs.forEach((c,i)=>{
      const x=t.x+PAD+i*(CW+COLG),yy=t.y+TH;
      const hb=document.createElement('button');hb.className='chhead';
      Object.assign(hb.style,{left:x+'px',top:yy+'px',width:CW+'px'});
      hb.innerHTML=`<span class="no">${esc(c.no)}</span><span class="ct">${esc(c.title)}</span>`;
      hb.onclick=e=>{e.stopPropagation();if(!moved)openChapter(c.id,true)};
      world.insertBefore(hb,svg);
      c.cards.forEach((k,j)=>{
        const b=document.createElement('button');b.className='card'+(k.kind==='quiz'?' quiz':'');b.id='c-'+k.id;
        k.x=x;k.y=yy+CHH+j*(CH+CG);
        Object.assign(b.style,{left:k.x+'px',top:k.y+'px',width:CW+'px',height:CH+'px'});
        const n=linksOf[k.id].length;
        b.innerHTML=`<span class="ttl">${esc(k.title)}</span>`+

  if(last){const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>4||moved){if(!moved){moved=true;vp.classList.add('drag');try{vp.setPointerCapture(e.pointerId)}catch(_){}}view.x+=dx;view.y+=dy;apply();last={x:e.clientX,y:e.clientY}}}});

    `<div class="store" style="flex-basis:100%">${esc(waitNote||(storeKind==='db'?'記録はあなたのアカウントに保存され、ほかの端末でも見える':storeKind==='local'?'記録はこの端末のブラウザにだけ残る':''))}</div></div>`}

  if(delta>0){const hist=before?[...(before.hist||[]),before.at].slice(-20):[];next={n,at:new Date().toISOString(),hist}}
  else if(n>0){const hist=(before.hist||[]).slice();const at=hist.pop()||before.at;next={n,at,hist}}
  if(next)reads[id]=next;else delete reads[id];
  busy[id]=true;paintReads();
  const write=async()=>{if(store){const d=store.doc(id);if(next)await d.set(next);else await d.delete()}
    else{try{localStorage.setItem('dva-reads',JSON.stringify(reads))}catch(_){}}};
  let msg='',failed=false,code='';
  try{await write()}catch(e){failed=true;code=e&&e.code||'error';
    const known=['invalid_argument','resource_exhausted','quota_exceeded','revoked','not_granted','capability_disabled','capability_removed','transform_error'];
    if(!known.includes(code)){await new Promise(r=>setTimeout(r,300+Math.random()*500));try{await write();failed=false}catch(e2){code=e2&&e2.code||'error'}}}
  if(failed){
    if(before)reads[id]=before;else delete reads[id];
    if(code==='invalid_argument'||code==='not_granted'||code==='transform_error'){readonly=true;msg='この表示では記録を書けない';note=msg}
    else if(code==='resource_exhausted')msg='操作が多すぎる。少し待ってから押して';
    else if(code==='quota_exceeded')msg='保存できる量を超えた';
    else if(code==='revoked'||code==='capability_disabled'||code==='capability_removed'){readonly=true;msg='記録が使えなくなった。ページを開き直して';note=msg}
    else msg='保存できなかった。少し待ってもう一度押して';
  }
  if(msg&&!readonly)msgs[id]={t:msg};else delete msgs[id];
  busy[id]=false;paintReads();
  if(msg){const a=document.activeElement,onSt=a&&a.classList&&a.classList.contains('st')&&a.closest(`[data-rb="${id}"]`);
    const said=readonly&&note?note:msg;
    if(!onSt)announce(id===sel?said:`「${cardById[id].title}」の記録：${said}`)}
}
function announce(msg){const l=$('live');l.textContent='';setTimeout(()=>{l.textContent=msg},50)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
})();
</script>
